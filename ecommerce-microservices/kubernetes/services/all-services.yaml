apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: MyCart
spec:
  clusterIP: None
  selector:
    app: mongodb
  ports:
  - port: 27017
    targetPort: 27017
---
# =============================================
# FRONTEND SERVICES (Standard ClusterIP)
# =============================================
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: MyCart
spec:
  selector:
    app: api-gateway
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-ui
  namespace: MyCart
spec:
  selector:
    app: frontend-ui
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
---
# =============================================
# BACKEND SERVICES (Headless - clusterIP: None)
# =============================================
