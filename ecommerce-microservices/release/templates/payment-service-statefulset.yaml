apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: payment-service
  namespace: {{ .Values.namespace }}
spec:
  serviceName: payment-service
  replicas: {{ .Values.paymentService.replicas }}
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      initContainers:
      - name: wait-for-mongodb
        image: busybox:1.36
        command: ['sh', '-c', 'echo "Waiting for MongoDB..."; until nc -z mongodb 27017; do sleep 2; done; echo "MongoDB is ready!"']
      containers:
      - name: payment-service
        image: {{ .Values.paymentService.image.repository }}:{{ .Values.paymentService.image.tag }}
        ports:
        - containerPort: 3009
        env:
        - name: PORT
          value: '3009'
        - name: ORDER_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: MyCart-config
              key: ORDER_SERVICE_URL
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: MyCart-secrets
              key: MONGO_URI_PAYMENT
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 3009
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3009
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
